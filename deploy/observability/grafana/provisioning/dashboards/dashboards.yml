# Grafana dashboard provisioning — loads dashboards from /var/lib/grafana/dashboards.
apiVersion: 1

providers:
  - name: "ForecastIQ"
    orgId: 1
    folder: "ForecastIQ"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
