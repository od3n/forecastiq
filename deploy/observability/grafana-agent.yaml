# ForecastIQ — Grafana Agent Configuration
# Deployed on the production VPS alongside the forecastiq binary.
# Scrapes local /metrics every 15 s and ships structured logs from journald.
#
# Secrets are supplied via environment variables (systemd EnvironmentFile):
#   GRAFANA_CLOUD_METRICS_URL   - Remote-write endpoint for metrics
#   GRAFANA_CLOUD_METRICS_USER  - Instance ID (numeric)
#   GRAFANA_CLOUD_METRICS_PASS  - API key (write scope)
#   GRAFANA_CLOUD_LOGS_URL      - Loki push endpoint
#   GRAFANA_CLOUD_LOGS_USER     - Instance ID (numeric)
#   GRAFANA_CLOUD_LOGS_PASS     - API key (write scope)
#
# Reference: docs/architecture/08-observability-architecture.md §1
# Reference: docs/operations/03-monitoring-and-alerting.md §1

server:
  log_level: info

metrics:
  wal_directory: /var/lib/grafana-agent/wal
  global:
    scrape_interval: 15s
    external_labels:
      cluster: forecastiq-prod
      environment: production
  configs:
    - name: forecastiq
      scrape_configs:
        - job_name: forecastiq
          static_configs:
            - targets: ["localhost:9090"]
              labels:
                service: forecastiq
          metrics_path: /metrics
          scrape_interval: 15s
      remote_write:
        - url: ${GRAFANA_CLOUD_METRICS_URL}
          basic_auth:
            username: ${GRAFANA_CLOUD_METRICS_USER}
            password: ${GRAFANA_CLOUD_METRICS_PASS}

logs:
  positions_directory: /var/lib/grafana-agent/positions
  configs:
    - name: forecastiq
      clients:
        - url: ${GRAFANA_CLOUD_LOGS_URL}
          basic_auth:
            username: ${GRAFANA_CLOUD_LOGS_USER}
            password: ${GRAFANA_CLOUD_LOGS_PASS}
          external_labels:
            cluster: forecastiq-prod
            environment: production
      scrape_configs:
        - job_name: journal
          journal:
            json: false
            max_age: 12h
            labels:
              job: forecastiq
            path: /var/log/journal
          relabel_configs:
            # Only ship logs from the forecastiq systemd unit.
            - source_labels: ["__journal__systemd_unit"]
              target_label: unit
            - source_labels: ["__journal__systemd_unit"]
              regex: "forecastiq.service"
              action: keep
          pipeline_stages:
            - json:
                expressions:
                  level: level
                  msg: msg
                  service: service
                  request_id: request_id
                  provider: provider
                  error_code: error_code
            # msg is intentionally NOT promoted to a label: ad-hoc debug
            # messages would create one Loki stream per distinct string
            # (unbounded cardinality; DRB-WP22-009). Query it via
            # `| json | msg="collection.failed"` per the runbook examples.
            - labels:
                level:
                service:
            - timestamp:
                source: ts
                format: "2006-01-02T15:04:05.000Z07:00"
