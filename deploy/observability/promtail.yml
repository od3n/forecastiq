# Promtail configuration — ships Docker container logs to Loki.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=forecastiq"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
    pipeline_stages:
      # Parse JSON structured logs from the app.
      - json:
          expressions:
            level: level
            msg: msg
            time: time
      # msg is intentionally NOT promoted to a label: free-text messages would
      # create one Loki stream per distinct string (unbounded cardinality;
      # DRB-WP23L-002 / DRB-WP22-009). Query it via `| json | msg="..."`.
      - labels:
          level:
      - timestamp:
          source: time
          format: "2006-01-02T15:04:05.999999999Z07:00"
