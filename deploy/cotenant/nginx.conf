# ForecastIQ co-tenant proxy — fronts the API on the dedicated origin port
# (host :8080). TLS terminates at Cloudflare (proxied DNS); this listens plain
# HTTP and only accepts the ForecastIQ hostname.
server {
    listen 80;
    server_name forecastiq-api.od3n.com;

    # Cloudflare is the only ingress (Origin Rule → :8080); trust its
    # forwarded client IP for the app's rate limiter / audit.
    real_ip_header CF-Connecting-IP;
    # Cloudflare IPv4/IPv6 ranges are refreshed at deploy time by
    # deploy-cotenant.sh (set_real_ip_from directives appended below the marker).
    # CF_REAL_IP_RANGES

    client_max_body_size 2m; # app enforces its own 1 MB limit (WP-25); this is a coarse guard

    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https; # TLS terminated at Cloudflare
        proxy_read_timeout 30s;
    }

    # Health probe bypasses proxy buffering for fast readiness checks.
    location = /healthz {
        proxy_pass http://api:8080/healthz;
        access_log off;
    }
}
