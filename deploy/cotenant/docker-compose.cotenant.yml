# ForecastIQ — CO-TENANT production compose. Runs on a host SHARED with another
# app (codex-usage) that already owns :80/:443 and Postgres.
#
# Differences from deploy/compose/docker-compose.prod.yml (standalone):
#   - NO db service — uses the neighbour's Postgres via host.docker.internal
#     (an isolated `forecastiq` database; see deploy/cotenant/setup-shared-db.sh).
#   - App is NOT published on :80. A dedicated proxy owns host :8080 (a
#     Cloudflare-supported origin port); the app is reachable only inside this
#     project's network.
#   - Project name `forecastiq` keeps containers/volumes clear of the
#     neighbour's `-p app` stack.
#
# Deployed to /opt/forecastiq/docker-compose.yml by deploy/cotenant/deploy-cotenant.sh.
# FIQ_IMAGE + the DB URL are supplied via /opt/forecastiq/.env (compose interpolation).

name: forecastiq

services:
  api:
    image: ${FIQ_IMAGE:-ghcr.io/od3n/forecastiq:latest}
    restart: unless-stopped
    # Reach the neighbour's Postgres (published on the host) without coupling
    # docker networks or clashing service aliases.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FIQ_ENV: production
      FIQ_DATABASE_URL: ${FIQ_DATABASE_URL:?set in /opt/forecastiq/.env}
      FIQ_METRICS_ADDR: 0.0.0.0:9090
      FIQ_CORS_ALLOW_ORIGINS: ${FIQ_DASHBOARD_ORIGIN:-https://forecastiq.od3n.com}
      FIQ_PAYLOAD_STORE_DIR: /data/payloads
      FIQ_BACKUP_STATUS_FILE: /data/backup-status.json
    env_file:
      - /opt/forecastiq/shared/secrets.env # auth/provider secrets (operator-managed)
    volumes:
      - /opt/forecastiq/payloads:/data/payloads
      - /opt/forecastiq/shared/backup-status.json:/data/backup-status.json
    # Loopback-only metrics exposure (host-local scrape); API is fronted by proxy.
    ports:
      - "127.0.0.1:9090:9090"

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    # Host :8080 is a Cloudflare-supported origin port. A Cloudflare Origin Rule
    # rewrites the destination port to 8080 for api.forecastiq.od3n.com so the
    # proxied hostname reaches this without touching the neighbour's :80 nginx.
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
