# ─────────────────────────────────────────────────────────────────────
# ForecastIQ — local development stack
#   make dev-up   → postgres + app (auto-migrate + idempotent seed, hot reload)
#   make dev-down → stop (keeps volumes)
#   make dev-reset→ destroy volumes + restart clean
# Secrets come from .env.local (gitignored; copy from .env.example).
# ─────────────────────────────────────────────────────────────────────
name: forecastiq

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forecastiq
      POSTGRES_USER: forecastiq
      POSTGRES_PASSWORD: forecastiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forecastiq -d forecastiq"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      target: dev
    env_file:
      - .env.local
    environment:
      # Compose-network overrides (service DNS, not localhost)
      FIQ_DATABASE_URL: postgres://forecastiq:forecastiq@postgres:5432/forecastiq?sslmode=disable
      FIQ_PAYLOAD_STORE_DIR: /var/lib/forecastiq/payloads
      FIQ_METRICS_ADDR: 0.0.0.0:9090
      FIQ_AUTO_MIGRATE: "true"
      FIQ_AUTO_SEED: "true"
      FIQ_ENV: development
      FIQ_CORS_ALLOW_ORIGINS: "http://localhost:3000,http://localhost:3001"
    ports:
      - "8080:8080"   # API
      - "9090:9090"   # metrics (dev convenience; prod binds localhost)
    volumes:
      - .:/src
      - payloads:/var/lib/forecastiq/payloads
    depends_on:
      postgres:
        condition: service_healthy
    command: ["air"]

  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3001:3000"
    volumes:
      - ./web:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_DEV_TOKEN: admin
    command: ["sh", "-c", "npm install --prefer-offline && npm run dev"]
    depends_on:
      - app

  # ── Observability (profile: obs) ─────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["obs"]
    ports:
      - "9091:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"

  loki:
    image: grafana/loki:3.1.0
    profiles: ["obs"]
    ports:
      - "3100:3100"
    volumes:
      - ./deploy/observability/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]

  promtail:
    image: grafana/promtail:3.1.0
    profiles: ["obs"]
    volumes:
      - ./deploy/observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["-config.file=/etc/promtail/config.yml"]
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["obs"]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  pgdata:
  payloads:
  prometheus_data:
  loki_data:
  grafana_data:
  frontend_node_modules:
