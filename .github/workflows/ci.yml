name: CI

on:
  push:
    branches: [main]
  pull_request:

# Trunk-based: short-lived branches, all jobs blocking (docs/delivery/02-ci-cd.md).
jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true
      - name: gofmt check
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './tools/*'))" || (gofmt -l $(find . -name '*.go' -not -path './tools/*') && exit 1)
      - name: golangci-lint (incl. depguard module boundaries)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          # v1 has no prebuilt binary compatible with Go 1.25 export data;
          # build v1.64.8 from source with the runner's Go 1.25 toolchain
          # (golangci-lint supports Go <= the version it was built with).
          install-mode: goinstall
          args: --timeout=5m
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
      - name: Unit tests (race + coverage)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -1
      - name: promtool check alert/recording rules
        # Gates PromQL expression validity so dead/miswritten rules cannot land
        # silently again (DRB-WP22 process note). Syntax + semantic checks only;
        # threshold correctness remains a review concern.
        run: |
          docker run --rm -v "$PWD/deploy/observability/alerts:/rules:ro" \
            --entrypoint /bin/promtool prom/prometheus:v3.5.0 \
            check rules /rules/rules.yaml /rules/recording-rules.yaml

  backend-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true
      - name: Integration tests (testcontainers PostgreSQL 16)
        run: go test -tags integration -count=1 -timeout 25m ./test/integration/...

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: forecastiq
          POSTGRES_USER: forecastiq
          POSTGRES_PASSWORD: forecastiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forecastiq"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true
      - name: Build binary
        run: go build -o bin/forecastiq ./cmd/forecastiq
      - name: Migrate up
        env:
          FIQ_DATABASE_URL: postgres://forecastiq:forecastiq@localhost:5432/forecastiq?sslmode=disable
          FIQ_ENV: test
        run: ./bin/forecastiq migrate up
      - name: Verify schema
        env:
          PGPASSWORD: forecastiq
        run: |
          psql -h localhost -U forecastiq -d forecastiq -c "\dt" | grep -q forecast_snapshots
          psql -h localhost -U forecastiq -d forecastiq -c "\dt" | grep -q collection_schedules
      - name: Seed (idempotent, run twice)
        env:
          FIQ_DATABASE_URL: postgres://forecastiq:forecastiq@localhost:5432/forecastiq?sslmode=disable
          FIQ_ENV: test
        run: ./bin/forecastiq seed && ./bin/forecastiq seed

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate committed OpenAPI spec
        run: |
          python3 - <<'PY'
          import json, sys
          spec = json.load(open("api/openapi/openapi.json"))
          assert spec["openapi"].startswith("3.1"), "must be OpenAPI 3.1"
          paths = spec["paths"]
          for required in ["/locations", "/providers", "/forecasts/latest",
                           "/admin/collections/trigger", "/forecast-collections",
                           "/rankings", "/rankings/methodology",
                           "/accuracy/summary", "/accuracy", "/forecast-comparison",
                           "/admin/health", "/me", "/api-keys", "/api-keys/{id}",
                           "/admin/users", "/auth/webhook", "/me/export", "/exports/{id}"]:
              assert required in paths, f"missing path {required}"
          print(f"OpenAPI valid: {len(paths)} paths")
          PY

  security:
    runs-on: ubuntu-latest
    # gitleaks-action lists PR commits via the REST API on pull_request events,
    # which needs pull-requests:read. The repo default token is contents:read
    # only, causing a 403 ("Resource not accessible by integration"). Grant the
    # least privilege needed so the scan runs (findings still fail the job).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image (distroless)
        run: docker build --target prod -t forecastiq:ci .
      - name: Trivy image scan (critical blocks)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: forecastiq:ci
          severity: CRITICAL
          exit-code: 1
          scanners: vuln,secret

  # ── Main branch only: build release artifact ─────────────────────────────
  build-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-checks, backend-integration, migrations, api-contract, security, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # cosign keyless signing (GitHub OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true
      - name: Build production binary (linux/amd64)
        env:
          VERSION: ${{ github.ref_name }}-${{ github.run_number }}
          COMMIT: ${{ github.sha }}
          BUILDDATE: ${{ github.event.head_commit.timestamp }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w \
              -X github.com/forecastiq/forecastiq/internal/platform/buildinfo.Version=${VERSION} \
              -X github.com/forecastiq/forecastiq/internal/platform/buildinfo.Commit=${COMMIT} \
              -X github.com/forecastiq/forecastiq/internal/platform/buildinfo.BuildDate=${BUILDDATE}" \
            -o forecastiq ./cmd/forecastiq
      - name: Generate checksums
        run: sha256sum forecastiq > checksums.txt
      - name: Sign release binary (cosign keyless, spec §4)
        uses: sigstore/cosign-installer@v3
      - name: Produce signature bundle
        run: cosign sign-blob --yes --bundle forecastiq.cosign.bundle forecastiq
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: forecastiq-release
          path: |
            forecastiq
            checksums.txt
            forecastiq.cosign.bundle
            migrations/
            deploy/
          retention-days: 90

  # ── Main branch only: deploy to production VPS ──────────────────────────
  deploy-api:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-release]
    runs-on: ubuntu-latest
    environment: production  # manual approval gate
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: forecastiq-release
      - name: Restore exec bit (artifact transport drops permissions)
        run: chmod +x forecastiq
      - name: Verify checksums
        run: sha256sum -c checksums.txt
      - name: Verify release signature (cosign keyless)
        uses: sigstore/cosign-installer@v3
      - name: cosign verify-blob
        run: |
          cosign verify-blob \
            --bundle forecastiq.cosign.bundle \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\.github/workflows/ci\.yml@refs/heads/main$" \
            forecastiq
      - name: Deploy to VPS
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }} # `ssh-keyscan -t ed25519 <host>` output
          VPS_USER: ${{ secrets.VPS_USER || 'deploy' }}
          VERSION: ${{ github.ref_name }}-${{ github.run_number }}
        run: |
          # Configure SSH with a pinned host key (no TOFU in CI).
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          echo "StrictHostKeyChecking yes" > ~/.ssh/config

          # rsync artifact to VPS. No trailing slashes on migrations/deploy:
          # the release must keep its directory layout (migrations/, deploy/).
          RELEASE_DIR="/opt/forecastiq/releases/${VERSION}"
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            forecastiq checksums.txt migrations deploy \
            "${VPS_USER}@${VPS_HOST}:${RELEASE_DIR}/"

          # Execute deploy steps on VPS. Privileged steps go through the
          # scoped sudo wrappers installed by deploy/bootstrap.sh.
          ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" bash <<REMOTE
            set -euo pipefail
            cd /opt/forecastiq

            # Symlink swap
            ln -sfn "${RELEASE_DIR}" /opt/forecastiq/current

            # Install configs (systemd unit + Caddyfile) + daemon-reload
            sudo /usr/local/bin/forecastiq-install-configs

            # Run migrations (wrapper sources /etc/forecastiq/secrets.env)
            sudo /usr/local/bin/forecastiq-migrate

            # Restart service
            sudo /usr/bin/systemctl restart forecastiq

            # Wait for readyz (max 30s)
            READY=0
            for i in \$(seq 1 30); do
              if curl -sf http://127.0.0.1:8080/readyz > /dev/null 2>&1; then
                echo "readyz OK after \${i}s"
                READY=1
                break
              fi
              sleep 1
            done
            if [ "\$READY" -ne 1 ]; then
              echo "ERROR: /readyz not green after 30s — deploy failed"
              exit 1
            fi

            # Smoke tests
            bash ${RELEASE_DIR}/deploy/scripts/smoke-test.sh

            # Cleanup: keep only last 5 releases
            ls -1dt /opt/forecastiq/releases/*/ | tail -n +6 | xargs rm -rf || true

            echo "Deploy complete: ${VERSION}"
          REMOTE
